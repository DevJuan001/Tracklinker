services:
  db:
    image: mysql:8.0
    container_name: tracklinker-db-dev
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - mysql_data_dev:/var/lib/mysql
    networks:
      - tracklinker-net

  redis:
    image: redis:7-alpine
    container_name: tracklinker-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - tracklinker-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tracklinker-backend-dev
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_URL=redis://redis:6379
    restart: always
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - tracklinker-net

  frontend:
    image: node:20-alpine
    container_name: tracklinker-frontend-dev
    working_dir: /app
    environment:
      - VITE_API_URL=${VITE_API_URL}
    volumes:
      - ./frontend_web/react+vite:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - tracklinker-net

volumes:
  redis_data_dev:
  mysql_data_dev:

networks:
  tracklinker-net:
    driver: bridge